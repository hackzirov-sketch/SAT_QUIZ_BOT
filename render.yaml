services:
  - type: web
    name: sat-quiz-teacher-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python render_start.py
    autoDeploy: true
    healthCheckPath: /health
    # === Persistent Disk (paid plan) ===
    # Mounts a 1GB persistent volume at /data
    # All bot data (DB, uploads) stored here survives deploys/restarts
    # Enable in Render Dashboard → Environment → Disk
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      # === Required (set in Render Dashboard) ===
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false

      # === Python Runtime ===
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: WEB_CONCURRENCY
        value: "1"

      # === Bot Settings ===
      - key: BOT_POLLING_ENABLED
        value: "1"
      - key: LOG_LEVEL
        value: INFO
      - key: TZ
        value: Asia/Tashkent

      # === Database Path ===
      # Free tier (default): bot/data/quiz_bot.db — ephemeral, lost on restart
      # Paid plan (with Disk at /data): use /data/quiz_bot.db to persist
      - key: DATABASE_PATH
        value: /data/quiz_bot.db
      - key: ALLOW_EPHEMERAL_SQLITE_FALLBACK
        value: "1"
      - key: DB_BUSY_TIMEOUT_MS
        value: "10000"

      # === Vocabulary (tracked in git, keep relative) ===
      - key: VOCABULARY_PATH
        value: data/vocabulary.json

      # === Subscription ===
      - key: SUBSCRIPTION_STRICT
        value: "1"
      - key: SUBSCRIPTION_CACHE_TTL
        value: "300"
      - key: CHANNEL_ID
        value: "@mathacademy01"
      # Bot must be added to the group/channel to verify membership.
      - key: GROUP_ID
        value: "-1002951908238"

      # === Weekly Report ===
      - key: WEEKLY_REPORT_ENABLED
        value: "1"
      - key: WEEKLY_REPORT_WEEKDAY
        value: "0"
      - key: WEEKLY_REPORT_HOUR
        value: "9"
      - key: WEEKLY_REPORT_MINUTE
        value: "0"
      - key: AI_MENTOR_ENABLED
        value: "1"
      - key: AI_DAILY_LIMIT_USD
        value: "0.50"
      - key: AI_USER_COOLDOWN_SECONDS
        value: "20"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
